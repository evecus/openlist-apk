name: Build OpenList Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ARM64 Release APK
      run: ./gradlew assembleArm64Release --stacktrace
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Sign APK
      if: github.event_name != 'pull_request'
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/arm64/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload APK artifact (unsigned)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: openlist-arm64-debug
        path: app/build/outputs/apk/arm64/release/*.apk
        retention-days: 7

    - name: Upload signed APK artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: openlist-arm64-release
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        name: OpenList Android ${{ github.ref_name }}
        body: |
          ## OpenList Android Client ${{ github.ref_name }}
          
          ### ARM64 Release APK
          
          A modern Android client for OpenList server.
          
          **Features:**
          - Connect to your OpenList server
          - Browse files with modern UI
          - Video & audio playback
          - File download support
          - Tablet landscape layout support
          
          **How to use:**
          1. Install the APK
          2. Enter your OpenList server address
          3. Login with your credentials
          4. Start browsing!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-debug:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ARM64 Debug APK
      run: ./gradlew assembleArm64Debug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: openlist-arm64-debug-${{ github.sha }}
        path: app/build/outputs/apk/arm64/debug/*.apk
        retention-days: 14
